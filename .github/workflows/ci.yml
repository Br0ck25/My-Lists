name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild and fail on drift
        run: |
          python3 build.py
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, sys
          diff = subprocess.run(
              ["git", "diff", "--ignore-cr-at-eol", "--", "worker_entry_combined.js"],
              capture_output=True, text=True,
          )
          if diff.stdout.strip():
              print(diff.stdout)
              sys.exit("worker_entry_combined.js drifted from source — run python3 build.py")
          print("build matches committed Worker")
          PY

      - name: Syntax check combined Worker
        run: node --check worker_entry_combined.js

      # `node --check` above proves the file PARSES. It says nothing about
      # whether the names in it exist, and this codebase is unusually exposed
      # to that gap: 27 sources are concatenated into ONE scope, so a const
      # declared inside one route's block is invisible to the next route's
      # block while looking, in the source, like it is right there.
      #
      # Three live bugs came from exactly that, and two of them sat behind a
      # bare catch, which is why 358 tests and five audits went past them:
      #   isShow    -> /lists/curated/<slug> answered HTTP 500 on every request
      #   clientId  -> Trakt OAuth silently never learned the user's username
      #   listName  -> the only list-copy event in the app never fired
      #
      # Mutation-tested: reintroducing any one of the three fails this step.
      - name: Every identifier resolves
        run: |
          npm install --no-save --no-audit --no-fund acorn@8.14.0 eslint-scope@8.2.0
          node scope_check.mjs worker worker_entry_combined.js
          node render_check.js rendered-scope.html > /dev/null
          node scope_check.mjs page rendered-scope.html

      # node --check above only parses the outer JS file. The served page
      # is a giant template literal that renderBuilder() returns as a
      # STRING -- a syntax error in the inline <script> it contains (i.e.
      # in any of 09_..24_, the client-side sources) is just string content
      # to that outer parser and would pass the step above silently, only
      # to break the page for every real visitor. This actually executes
      # renderBuilder() in a sandbox and syntax-checks what it returns.
      - name: Render + validate the builder page
        run: |
          node render_check.js rendered.html
          python3 html_checks.py rendered.html ci

      # /admin is a template literal too, and got none of the above. A single
      # backslash inside one is eaten before the browser sees it, so '\n\n'
      # in a confirm() string became a real newline, split a single-quoted
      # string across two lines, and made the entire 60KB dashboard script a
      # SyntaxError. Every admin control was dead for two days. The step above
      # cannot catch it -- it only renders the builder page -- and neither can
      # `node --check`, which sees both pages as string content.
      - name: Render + validate the admin dashboard
        run: |
          node render_check.js rendered-admin.html --admin
          python3 html_checks.py rendered-admin.html ci-admin

      # The two steps above prove the page PARSES. Neither can see the bug that
      # mattered most: JSON.stringify escapes " and \ but not "</script", so a
      # published list's name -- or an OAuth token baked into an install link --
      # ended the inline <script> element and every byte after it was parsed as
      # HTML. That was a stored XSS reachable with no account (POST
      # /api/publish-list, payload in the list NAME) and a reflected one through
      # any /<config>/configure link. Two audits called this area clean because
      # both tested the client-side render, where escapeHtml is applied
      # correctly, and neither tested the server-rendered preamble.
      #
      # This renders the same page with every caller-supplied field set to a
      # payload and asserts it came out inert -- and asserts the markers are
      # PRESENT first, so a render that quietly stopped including them cannot
      # pass by proving nothing.
      - name: Render the builder page with hostile input
        run: |
          node render_check.js rendered-hostile.html --hostile
          python3 html_checks.py rendered-hostile.html ci-hostile

      # /sw.js is a template literal as well, so `node --check` above sees it
      # as string content. A broken service worker is quieter than a broken
      # page: it just fails to register, and nothing looks wrong until offline
      # stops working.
      - name: Syntax-check the service worker
        run: |
          node render_check.js service-worker.js --sw
          node --check service-worker.js

      # gen_map.py is deterministic, so the committed map should always be
      # exactly what it produces. Without this check it silently rotted --
      # 26% of its line numbers pointed at the wrong line.
      - name: FUNCTION-MAP.md is current
        run: |
          python3 gen_map.py > /dev/null
          if ! git diff --ignore-cr-at-eol --quiet -- FUNCTION-MAP.md; then
            git diff --ignore-cr-at-eol -- FUNCTION-MAP.md
            echo "FUNCTION-MAP.md is stale — run: python3 gen_map.py"
            exit 1
          fi
          echo "FUNCTION-MAP.md matches source"

      - name: Test suite
        run: node --test tests/*.test.mjs
